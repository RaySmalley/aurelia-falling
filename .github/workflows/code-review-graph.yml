name: Advisory code-review graph

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Report structural risk and test gaps
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate advisory review report
        uses: tirth8205/code-review-graph@935695f800f2b02e71aae6d463f3df65f0c6493e # v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment: "true"
          fail-on-risk: none
          python-version: "3.12"
